<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#0ea5e9" />
    <meta name="description" content="BCCS Mobile - Blockchain Continuous Compliance Systems for aviation training document processing" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BCCS Mobile" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <title>BCCS Mobile - Aviation Compliance</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Disable HMR overlay globally before Vite loads
      window.__vite_plugin_react_preamble_installed__ = true;
      
      // Override Vite's HMR overlay configuration
      if (window.__vite_is_modern_browser) {
        window.__vite_plugin_react_preamble_installed__ = true;
      }
      
      // Set HMR overlay to false
      window.__vite_hmr_overlay_disabled = true;
      
      // Suppress Replit runtime error overlay
      window.__replit_runtime_error_plugin_disabled = true;
      
      // Override console methods to suppress specific errors
      const originalError = console.error;
      console.error = function(...args) {
        const message = args.join(' ');
        if (message.includes('useRef') || message.includes('runtime-error-plugin')) {
          return; // Suppress these specific errors
        }
        originalError.apply(console, args);
      };

      // Register service worker for PWA functionality
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('SW registered: ', registration);
            })
            .catch(registrationError => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
